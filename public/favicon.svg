<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="maroonGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#871924" />
      <stop offset="60%" stop-color="#6B121C" />
      <stop offset="100%" stop-color="#4A0B10" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B5" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#937233" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#maroonGrad)" filter="url(#subtleShadow)" />
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  
  <!-- Inner Delicate Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.85" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />

  <!-- Traditional Top Crest Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="256,76 261,90 276,90 264,99 268,113 256,104 244,113 248,99 236,90 251,90" />
    <circle cx="216" cy="94" r="3.5" />
    <circle cx="296" cy="94" r="3.5" />
  </g>

  <!-- Central Monogram "B" with serif elegance -->
  <text 
    x="256" 
    y="290" 
    font-family="'Playfair Display', Georgia, 'Cinzel', serif" 
    font-size="190" 
    font-weight="700" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="2"
  >B</text>

  <!-- Sub-label 40+ YRS / ESTD -->
  <path d="M 170 380 Q 256 395 342 380" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />
  <text 
    x="256" 
    y="415" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-size="34" 
    font-weight="700" 
    fill="#FAF8F5" 
    text-anchor="middle"
    letter-spacing="8"
  >BALAJI</text>

  <text 
    x="256" 
    y="445" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-size="18" 
    font-weight="600" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    letter-spacing="4"
  >40+ YEARS TRUST</text>
</svg>
