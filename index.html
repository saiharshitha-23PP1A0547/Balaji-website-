<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balaji Mutton Shop | 40+ Years of Trust & Tradition</title>
    <meta name="title" content="Balaji Mutton Shop | Fresh Mutton, Live Goats & Sheep" />
    <meta
      name="description"
      content="Balaji Mutton Shop — a trusted 40+ year family legacy offering fresh mutton, live goats, live sheep, and special & bulk orders."
    />
    <meta name="keywords" content="Balaji Mutton Shop, fresh mutton, live goats, live sheep, bulk mutton order, wedding mutton order, family butcher, fresh meat" />
    <meta name="author" content="Kamtekar Badrinath & Shyam" />
    <meta name="application-name" content="Balaji Mutton Shop" />
    <meta name="apple-mobile-web-app-title" content="Balaji Mutton Shop" />
    <meta name="theme-color" content="#4A0B10" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://balajimuttonshop.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="business.business" />
    <meta property="og:title" content="Balaji Mutton Shop | Fresh Mutton, Live Goats & Sheep" />
    <meta
      property="og:description"
      content="Balaji Mutton Shop — a trusted 40+ year family legacy offering fresh mutton, live goats, live sheep, and special & bulk orders."
    />
    <meta property="og:site_name" content="Balaji Mutton Shop" />
    <meta property="og:url" content="https://balajimuttonshop.com" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Balaji Mutton Shop | Fresh Mutton, Live Goats & Sheep" />
    <meta
      name="twitter:description"
      content="Balaji Mutton Shop — a trusted 40+ year family legacy offering fresh mutton, live goats, live sheep, and special & bulk orders."
    />

    <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- LocalBusiness / ButcherShop Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ButcherShop",
      "name": "Balaji Mutton Shop",
      "image": "https://balajimuttonshop.com/images/shop-placeholder.jpg",
      "url": "https://balajimuttonshop.com",
      "telephone": "+91-XXXXXXXXXX",
      "priceRange": "₹₹",
      "description": "Balaji Mutton Shop — a trusted 40+ year family legacy offering fresh mutton, live goats, live sheep, and special & bulk orders.",
      "founder": {
        "@type": "Person",
        "name": "Kamtekar Eshwar Ji"
      },
      "founders": [
        {
          "@type": "Person",
          "name": "Kamtekar Eshwar Ji"
        }
      ],
      "employee": [
        {
          "@type": "Person",
          "name": "Kamtekar Badrinath"
        },
        {
          "@type": "Person",
          "name": "Kamtekar Shyam"
        }
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[Shop Address / Street Landmark]",
        "addressLocality": "[City]",
        "addressRegion": "[State]",
        "postalCode": "[PIN Code]",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "0.000000",
        "longitude": "0.000000"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "07:00",
          "closes": "20:30"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Butcher and Livestock Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "Fresh Mutton",
              "description": "Daily cut fresh mutton prepared to customer preference"
            },
            "price": "1000",
            "priceCurrency": "INR"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Live Goats",
              "description": "Live goats for functions, rituals, and special events"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Live Sheep",
              "description": "Live sheep available on advance enquiry"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Special & Bulk Orders",
              "description": "Bulk mutton, goat and sheep orders for weddings, birthdays, festivals, and parties"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#1F1B1A] antialiased selection:bg-[#70161E] selection:text-[#FBF9F4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
